[project]
name = "storylog-backend"
version = "0.1.0"
description = "Minimal Django backend scaffold for StoryLog"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "pytest>=8.0",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.uv]
package = false
